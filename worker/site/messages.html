<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RMC14 Messages</title>
    <link rel="icon" type="image/png" href="/sleeping.png">
    <style>
        :root {
            color-scheme: dark;
            --bg: #0d1419;
            --panel: #152029;
            --text: #e6edf3;
            --muted: #9db0c0;
            --border: #2a3a47;
            --accent: #3fa2ff;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: radial-gradient(circle at 20% 0%, #1a2a36 0%, #0d1419 60%);
            color: var(--text);
        }

        .wrap {
            max-width: 960px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .panel {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.5rem;
        }

        .meta {
            color: var(--muted);
            margin-bottom: 16px;
        }

        .message-form {
            display: grid;
            gap: 8px;
            margin-bottom: 16px;
        }

        .message-form textarea {
            width: 100%;
            min-height: 96px;
            box-sizing: border-box;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #0f1a22;
            color: var(--text);
            font: inherit;
            resize: vertical;
        }

        .message-form button {
            justify-self: start;
        }

        .message-status {
            min-height: 1.2rem;
            color: var(--muted);
            font-size: 0.9rem;
        }

        .messages {
            display: grid;
            gap: 12px;
        }

        .message-card {
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            background: #0f1a22;
        }

        .message-meta {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .message-body {
            white-space: pre-wrap;
            line-height: 1.5;
        }

        a {
            color: var(--accent);
        }
    </style>
</head>
<body>
<div class="wrap">
    <div class="panel">
        <h1>Messages</h1>
        <div class="meta">Latest anonymous responses from the banner button.</div>
        <div class="meta"><a href="/">Back to dashboard</a></div>
        <form class="message-form" id="message-form">
            <textarea id="message-input" placeholder="Leave a message for daylight.txt..." required></textarea>
            <button type="submit">Send message</button>
            <div class="message-status" id="message-status" aria-live="polite"></div>
        </form>
        <div class="messages" id="messages-list"></div>
        <div class="meta" id="messages-empty" hidden>No messages yet.</div>
        <div class="meta" id="messages-error" hidden></div>
    </div>
</div>
<script>
function formatMessageTimestamp(value) {
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) {
        return value;
    }

    const day = date.getDate();
    const ordinal = day % 100 >= 11 && day % 100 <= 13
        ? "th"
        : ["th", "st", "nd", "rd"][day % 10] || "th";

    const formatted = new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        day: "numeric",
        month: "long",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        hour12: false,
        timeZoneName: "short"
    }).format(date);

    const relative = (() => {
        const diffMs = Date.now() - date.getTime();
        const diffMinutes = Math.round(diffMs / 60000);
        if (diffMinutes <= 0) {
            return "just now";
        }
        if (diffMinutes < 60) {
            return `${diffMinutes} minute${diffMinutes === 1 ? "" : "s"} ago`;
        }
        const diffHours = Math.round(diffMinutes / 60);
        if (diffHours < 24) {
            return `${diffHours} hour${diffHours === 1 ? "" : "s"} ago`;
        }
        const diffDays = Math.round(diffHours / 24);
        return `${diffDays} day${diffDays === 1 ? "" : "s"} ago`;
    })();

    return `${formatted.replace(/(\d{1,2})/, `$1${ordinal}`)} (${relative})`;
}

async function loadMessages() {
    const list = document.getElementById("messages-list");
    const empty = document.getElementById("messages-empty");
    const error = document.getElementById("messages-error");

    try {
        const resp = await fetch("/api/messages");
        const payload = await resp.json();
        if (!resp.ok) {
            throw new Error(payload.error || "Failed to load messages.");
        }

        list.innerHTML = "";
        if (!payload.messages || payload.messages.length === 0) {
            empty.hidden = false;
            return;
        }

        empty.hidden = true;
        for (const item of payload.messages) {
            const card = document.createElement("article");
            card.className = "message-card";

            const meta = document.createElement("div");
            meta.className = "message-meta";
            meta.textContent = formatMessageTimestamp(item.created_at);

            const body = document.createElement("div");
            body.className = "message-body";
            body.textContent = item.message;

            card.appendChild(meta);
            card.appendChild(body);
            list.appendChild(card);
        }
    } catch (err) {
        error.hidden = false;
        error.textContent = err.message;
    }
}

document.getElementById("message-form").addEventListener("submit", async (event) => {
    event.preventDefault();

    const input = document.getElementById("message-input");
    const status = document.getElementById("message-status");
    const message = input.value.trim();

    if (!message) {
        status.textContent = "Please enter a message before sending.";
        status.style.color = "#ff6b9a";
        return;
    }

    status.textContent = "Sending...";
    status.style.color = "var(--muted)";

    try {
        const resp = await fetch("/api/messages", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ message })
        });
        const payload = await resp.json();
        if (!resp.ok) {
            throw new Error(payload.error || "Failed to submit message.");
        }

        input.value = "";
        status.textContent = "Message sent.";
        status.style.color = "#7ee787";
        await loadMessages();
    } catch (err) {
        status.textContent = err.message;
        status.style.color = "#ff6b9a";
    }
});

loadMessages();
</script>
</body>
</html>
